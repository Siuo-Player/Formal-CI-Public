name: lean

on:
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'formal/**'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Restore Lean/Lake cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/lean/lake-manifest.json
            formal/lean/.lake/build
            formal/lean/.lake/packages
          key: formal-ci-lean-v4.33.0-${{ runner.os }}-${{ hashFiles('formal/lean/lakefile.toml') }}
          restore-keys: |
            formal-ci-lean-v4.33.0-${{ runner.os }}-
      - name: Install Elan
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
      - name: Expose Elan
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: elan toolchain install leanprover/lean4:v4.33.0
      - name: Select pinned Lean toolchain
        run: elan default leanprover/lean4:v4.33.0
      - name: Verify Lean toolchain
        run: |
          set -euo pipefail
          lean --version
          lake --version
      - name: Resolve dependencies on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: formal/lean
        run: lake update
      - name: Build formal development
        working-directory: formal/lean
        run: lake build
